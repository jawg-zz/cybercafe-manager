services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    expose:
      - "8002"
    environment:
      - DATABASE_URL=sqlite:///./data/cybercafe.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - MPESA_ENV=${MPESA_ENV:-sandbox}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY:-}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET:-}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE:-}
    
    volumes:
      - cafe-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dokploy-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.agents-openclaw-ay7y6u-357-web.rule=Host(`cyber.spidmax.win`)
      - traefik.http.routers.agents-openclaw-ay7y6u-357-web.entrypoints=web
      - traefik.http.services.agents-openclaw-ay7y6u-357-web.loadbalancer.server.port=80
      - traefik.http.routers.agents-openclaw-ay7y6u-357-web.service=agents-openclaw-ay7y6u-357-web
      - traefik.http.routers.agents-openclaw-ay7y6u-357-web.middlewares=redirect-to-https@file
      - traefik.http.routers.agents-openclaw-ay7y6u-357-websecure.rule=Host(`cyber.spidmax.win`)
      - traefik.http.routers.agents-openclaw-ay7y6u-357-websecure.entrypoints=websecure
      - traefik.http.services.agents-openclaw-ay7y6u-357-websecure.loadbalancer.server.port=80
      - traefik.http.routers.agents-openclaw-ay7y6u-357-websecure.service=agents-openclaw-ay7y6u-357-websecure
      - traefik.http.routers.agents-openclaw-ay7y6u-357-websecure.tls=true    
    
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true

volumes:
  cafe-data:
